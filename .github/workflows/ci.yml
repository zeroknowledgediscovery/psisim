name: Standalone build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build python3-dev
          python3 -m pip install --disable-pip-version-check -r applications/psisimulation/requirements.txt -r webapp/requirements.txt

      - name: Build standalone bindings
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target predict_distribution qdistance psisim_dynamics -j "$(nproc)"

      - name: Import bindings
        env:
          PYTHONPATH: ${{ github.workspace }}/bin
        run: |
          python3 - <<'PY'
          import predict_distribution
          import qdistance
          import psisim_dynamics
          print("predict_distribution:", predict_distribution.__file__)
          print("qdistance:", qdistance.__file__)
          print("psisim_dynamics:", psisim_dynamics.__file__)
          PY

      - name: Compile Python sources
        run: python3 -m compileall -q applications/psisimulation webapp tests

      - name: Check webapp client syntax
        run: node --check webapp/static/app.js

      - name: Model cache unit test
        run: python3 tests/test_model_cache.py

      - name: Fetch GSS 2018 model
        run: python3 applications/psisimulation/fetch_model.py gss/gss_2018

      - name: Propagation dynamics regression tests
        run: python3 tests/test_propagation_dynamics.py

      - name: Webapp engine smoke test
        working-directory: webapp
        run: python3 smoke_test.py
